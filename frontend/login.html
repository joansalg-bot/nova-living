<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso administrador | Nova Living</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    rgba(245, 242, 236, 0.92),
                    rgba(245, 242, 236, 0.96)
                ),
                linear-gradient(135deg, #eee8df, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #222;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e7e1d8;
            border-radius: 22px;
            padding: 42px 36px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: #1f1f1f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 30px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #777;
            font-size: 14px;
        }

        .admin-label {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f2eee8;
            color: #665c50;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            border: 1px solid #d9d3ca;
            border-radius: 11px;
            padding: 0 48px 0 15px;
            font-size: 15px;
            outline: none;
            background: #fcfbf9;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #8c8173;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(140, 129, 115, 0.10);
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: #777;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #222;
        }

        .login-button {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: #1f1f1f;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #353535;
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            border: 1px solid #f0cccc;
            color: #a33a3a;
        }

        .message.success {
            display: block;
            background: #eff9f1;
            border: 1px solid #c9e6cf;
            color: #28753a;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #999;
            font-size: 12px;
        }

        .footer span {
            color: #777;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 34px 24px;
                border-radius: 18px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">

                <div class="brand-logo">
                    NL
                </div>

                <h1>NOVA LIVING</h1>

                <p>Muebles y decoración para transformar tu hogar.</p>

                <span class="admin-label">
                    Panel de administración
                </span>

            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Mostrar contraseña"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Iniciar sesión
                </button>

            </form>

            <div class="footer">
                Nova Living · <span>Administración</span>
            </div>

        </section>

    </main>


    <script>

        const API_BASE_URL = "https://nova-living-rein.onrender.com";

        const loginForm = document.getElementById("loginForm");
        const usuarioInput = document.getElementById("usuario");
        const contrasenaInput = document.getElementById("contrasena");
        const loginButton = document.getElementById("loginButton");
        const togglePassword = document.getElementById("togglePassword");
        const message = document.getElementById("message");


        function mostrarMensaje(texto, tipo) {

            message.textContent = texto;

            message.className = "message " + tipo;

        }


        togglePassword.addEventListener("click", function () {

            if (contrasenaInput.type === "password") {

                contrasenaInput.type = "text";

                togglePassword.textContent = "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Ocultar contraseña"
                );

            } else {

                contrasenaInput.type = "password";

                togglePassword.textContent = "👁";

                togglePassword.setAttribute(
                    "aria-label",
                    "Mostrar contraseña"
                );

            }

        });


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const usuario = usuarioInput.value.trim();
            const contrasena = contrasenaInput.value;

            if (!usuario || !contrasena) {

                mostrarMensaje(
                    "Por favor completa todos los campos.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent = "Verificando...";

            message.className = "message";


            try {

                const respuesta = await fetch(
                    `${API_BASE_URL}/auth/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            usuario: usuario,
                            contrasena: contrasena
                        })
                    }
                );


                const datos = await respuesta.json();


                if (!respuesta.ok) {

                    throw new Error(
                        datos.detail || "No fue posible iniciar sesión."
                    );

                }


                sessionStorage.setItem(
                    "nova_living_admin",
                    "true"
                );

                sessionStorage.setItem(
                    "nova_living_admin_usuario",
                    datos.usuario
                );


                mostrarMensaje(
                    "Inicio de sesión correcto. Entrando al panel...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href = "admin.html";

                }, 700);


            } catch (error) {

                mostrarMensaje(
                    error.message || "Error de conexión con el servidor.",
                    "error"
                );

                loginButton.disabled = false;

                loginButton.textContent = "Iniciar sesión";

            }

        });

    </script>

</body>
</html>
